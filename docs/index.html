<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#150a24" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<title>生日快乐 🎂</title>
<!--
  ============================================================
  一个可以用「吹气」吹灭蜡烛的电子生日蛋糕（单文件，无需联网、无外部素材）

  ★ 想改内容？只需要改页面下方脚本里的 CONFIG 配置块
    （在文件靠下部分，搜索 “CONFIG” 就能找到），
    那里有收件人称呼、祝福语、落款、蜡烛数量。

  ★ 使用环境要求（很重要）：
    1. 必须用 https:// 域名打开，微信内置浏览器才能申请麦克风；
    2. 她的微信需要麦克风权限（iOS：设置 → 微信 → 麦克风）；
    3. 页面里点「开始」后，系统弹窗要点「允许」。
  ============================================================
-->
<style>
  /* ---------------- 配色变量（会被 CONFIG.colors 覆盖） ---------------- */
  :root{
    --bot-1:#f0aec8; --bot-2:#e98bb0; --bot-3:#ba6f8d;
    --mid-1:#f9dca2; --mid-2:#f7cd7a; --mid-3:#c6a462;
    --top-1:#f0b1cb; --top-2:#ea8fb4; --top-3:#bb7290;
    --cream-1:#fffbf4; --cream-2:#fff7ea; --cream-a0:rgba(255,247,234,0);
    --candle-a:#ffffff; --candle-b:#ff9dbb;
    --flame-in:#fff2e1; --flame-mid:#ffd18f; --flame-core:#ffab34;
    --flame-glow:rgba(255,171,52,.42); --flame-glow2:rgba(255,171,52,.16);
  }
  /* ---------------- 基础 ---------------- */
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; padding:0; overflow:hidden; }
  body{
    background:#120819; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #stage{
    position:fixed; top:0; left:0; width:100%; height:100vh; height:100dvh;
    overflow:hidden; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
  }
  .hidden{ display:none !important; }

  /* ---------------- 夜空 ---------------- */
  .sky{
    position:absolute; left:0; top:0; right:0; bottom:0; z-index:0;
    background:
      radial-gradient(120% 78% at 50% 0%, #35205e 0%, #221040 42%, #120819 78%, #0a0410 100%);
  }
  .sky::before,.sky::after{
    content:""; position:absolute; left:-15%; top:-15%; width:130%; height:130%;
    background-repeat:repeat; will-change:opacity;
  }
  .sky::before{
    background-image:
      radial-gradient(1.6px 1.6px at 24px 36px, rgba(255,255,255,.95), transparent),
      radial-gradient(1.3px 1.3px at 128px 96px, rgba(255,242,214,.85), transparent),
      radial-gradient(1.8px 1.8px at 74px 168px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 176px 52px, rgba(214,232,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 46px 214px, rgba(255,255,255,.7), transparent);
    background-size:232px 232px;
    animation:twinkle 5.5s ease-in-out infinite;
  }
  .sky::after{
    background-image:
      radial-gradient(1px 1px at 16px 22px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 92px 74px, rgba(255,235,200,.7), transparent),
      radial-gradient(1px 1px at 140px 132px, rgba(255,255,255,.55), transparent);
    background-size:160px 160px;
    animation:twinkle 4s ease-in-out infinite reverse;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.45 } 50%{ opacity:.95 } }

  .moon{
    position:absolute; z-index:1; top:16%; right:6%; width:56px; height:56px;
    border-radius:50%;
    background:radial-gradient(circle at 34% 34%, #fffdf2, #ffeab0 58%, #f4d68d 100%);
    box-shadow:0 0 46px 16px rgba(255,228,160,.22), 0 0 120px 48px rgba(255,210,140,.10);
    opacity:.9; transition:opacity 1.2s ease;
  }
  /* 矮屏（小屏 iPhone / 微信里被压缩的可视高度）自动缩小蛋糕，给祝福卡留位置 */
  @media (max-height:700px){
    .cake{ transform:scale(.88); transform-origin:50% 100%; }
  }
  @media (max-height:620px){
    .cake{ transform:scale(.8); transform-origin:50% 100%; }
  }

  /* ---------------- 画布（彩带/烟花/气流） ---------------- */
  #fx{ position:absolute; left:0; top:0; width:100%; height:100%; z-index:8; pointer-events:none; }

  /* ---------------- 场景与蛋糕 ---------------- */
  .scene{
    position:relative; z-index:2; width:100%;
    flex:1 1 auto; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:calc(9vh + env(safe-area-inset-bottom, 0px));
  }
  .glow{
    position:absolute; z-index:-1; left:50%; bottom:16vh;
    width:420px; height:320px; margin-left:-210px;
    background:radial-gradient(ellipse at 50% 62%, rgba(255,196,110,.42), rgba(255,160,80,.14) 45%, rgba(255,140,60,0) 72%);
    filter:blur(6px);
    transition:opacity .35s ease;
    pointer-events:none;
  }
  .cake{
    position:relative; width:300px; height:320px;
    transform-origin:50% 100%;
  }

  .layer{ position:absolute; left:50%; transform:translateX(-50%); border-radius:9px; }
  .layer::after{ /* 侧面阴影，增加体积感 */
    content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(0,0,0,0) 34%, rgba(0,0,0,.16));
  }
  .layer.bot{ width:272px; height:92px; bottom:16px; background:linear-gradient(180deg,var(--bot-1) 0%,var(--bot-2) 58%,var(--bot-3) 100%); }
  .layer.mid{ width:224px; height:78px; bottom:104px; background:linear-gradient(180deg,var(--mid-1) 0%,var(--mid-2) 58%,var(--mid-3) 100%); }
  .layer.top{ width:176px; height:64px; bottom:178px; background:linear-gradient(180deg,var(--top-1) 0%,var(--top-2) 58%,var(--top-3) 100%); }

  /* 奶油（顶部一条 + 波浪形下垂的糖霜） */
  .drip{
    position:absolute; left:-3px; right:-3px; top:-3px; height:19px;
    background:linear-gradient(180deg,var(--cream-1),var(--cream-2));
    border-radius:7px 7px 3px 3px;
    box-shadow:0 1px 0 rgba(0,0,0,.05) inset;
  }
  .drip::after{
    content:""; position:absolute; left:0; right:0; top:100%; height:15px;
    background:radial-gradient(circle at 9px 0, var(--cream-2) 9px, var(--cream-a0) 9.6px) repeat-x;
    background-size:18px 15px;
  }

  .plate{
    position:absolute; z-index:0; left:50%; bottom:2px; transform:translateX(-50%);
    width:300px; height:30px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 26%, #ffffff 0%, #e6e0f2 55%, #bdb2d6 100%);
    box-shadow:0 14px 32px rgba(0,0,0,.42);
  }
  .shadow{
    position:absolute; left:50%; bottom:-16px; transform:translateX(-50%);
    width:268px; height:36px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.5), rgba(0,0,0,0) 68%);
    filter:blur(5px);
  }

  /* ---------------- 蜡烛与火焰 ---------------- */
  .candles{
    position:absolute; z-index:3; left:50%; bottom:238px;
    width:158px; height:0; transform:translateX(-50%);
  }
  .candle{
    position:absolute; bottom:0; width:9px; height:40px; margin-left:-4.5px;
    border-radius:4px 4px 3px 3px;
    background:repeating-linear-gradient(133deg, var(--candle-a) 0 5px, var(--candle-b) 5px 10px);
    box-shadow:inset -2px 0 3px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.18);
  }
  .candle::before{ /* 手指点按的热区（备用吹灭方式） */
    content:""; position:absolute; left:-11px; right:-11px; top:-52px; bottom:-8px;
  }
  .candle::after{ /* 灯芯 */
    content:""; position:absolute; left:50%; bottom:100%; width:2px; height:5px; margin-left:-1px;
    background:#4a3a33; border-radius:1px;
  }
  .candle .wrap{
    position:absolute; left:50%; bottom:100%; width:22px; height:32px; margin-left:-11px;
    transform-origin:50% 100%;
    will-change:transform;
  }
  .candle .flame{
    position:absolute; left:50%; bottom:1px; width:13px; height:23px; margin-left:-6.5px;
    border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
    background:radial-gradient(ellipse at 50% 76%, var(--flame-in) 0%, var(--flame-mid) 32%, var(--flame-core) 64%, var(--flame-glow2) 100%);
    box-shadow:0 0 13px 5px var(--flame-glow), 0 0 40px 15px var(--flame-glow2);
    animation:flick .19s ease-in-out infinite alternate;
    transform-origin:50% 100%;
    transition:opacity .22s ease;
  }
  @keyframes flick{
    from{ transform:scale(1.03,.94) translateY(0); }
    to{ transform:scale(.96,1.07) translateY(-1px); }
  }
  .candle.out .flame{ opacity:0 !important; }
  .candle.out::after{ background:#2e231f; }
  .candle.out{ filter:brightness(.94) saturate(.9); }

  .smoke{
    position:absolute; left:50%; bottom:100%; width:11px; height:11px; margin-left:-5.5px;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 72%);
    animation:smokeUp 1.9s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{ opacity:.6; transform:translate(0,2px) scale(.5); }
    100%{ opacity:0; transform:translate(var(--dx,6px),-78px) scale(3.2); }
  }

  /* ---------------- 顶部提示与强度条 ---------------- */
  .hint{
    position:absolute; z-index:5; left:0; right:0;
    top:calc(env(safe-area-inset-top, 0px) + 22px);
    text-align:center; padding:0 24px;
    transition:opacity .5s ease;
  }
  .hint-main{
    font-size:17px; font-weight:600; letter-spacing:.4px;
    color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.5);
    transition:opacity .5s ease;
  }
  .hint-sub{
    margin-top:7px; font-size:12.5px; line-height:1.6;
    color:rgba(255,255,255,.62); text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .meter-wrap{
    position:absolute; z-index:5; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 12px);
    transform:translateX(-50%); text-align:center;
    transition:opacity .5s ease;
  }
  .meter{
    width:132px; height:6px; border-radius:3px; overflow:hidden;
    background:rgba(255,255,255,.13);
    box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;
  }
  .meter i{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#8ee0ff,#fff0a8 55%,#ffb066);
    border-radius:3px;
  }
  .mic-state{ margin-top:8px; font-size:11.5px; color:rgba(255,255,255,.5); }

  /* ---------------- 祝福卡片 ---------------- */
  .card{
    position:absolute; z-index:10; left:50%; top:9%;
    width:min(86vw, 400px);
    padding:22px 22px 18px;
    border-radius:20px;
    background:linear-gradient(180deg, rgba(38,20,60,.86), rgba(26,12,42,.9));
    border:1px solid rgba(255,214,150,.28);
    box-shadow:0 22px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04) inset;
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    opacity:0; transform:translateX(-50%) translateY(16px) scale(.96);
    transition:opacity .8s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  .card.show{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  .card-to{ font-size:12.5px; letter-spacing:2px; color:#ffd9a1; margin-bottom:12px; }
  .card p{
    margin:0 0 11px; font-size:15.5px; line-height:1.78; color:#fff;
    opacity:0; transform:translateY(8px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .card p.show{ opacity:1; transform:translateY(0); }
  .card p.big{ font-size:21px; font-weight:700; line-height:1.5; letter-spacing:.5px; }
  .card-from{ margin-top:14px; text-align:right; font-size:12.5px; color:rgba(255,255,255,.6); letter-spacing:.5px; }

  /* ---------------- 右上角小按钮 / 设置面板 ---------------- */
  .tools{
    position:absolute; z-index:12; right:12px;
    top:calc(env(safe-area-inset-top, 0px) + 14px);
    display:flex; gap:8px;
  }
  .icon-btn{
    width:36px; height:36px; padding:0; border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08); color:#fff;
    font-size:15px; line-height:1; cursor:pointer;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .icon-btn:active{ transform:scale(.94); }
  .panel{
    position:absolute; z-index:14; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
    width:min(88vw, 360px); transform:translateX(-50%);
    padding:18px; border-radius:18px; text-align:center;
    background:rgba(28,14,46,.94); border:1px solid rgba(255,255,255,.12);
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  .panel-title{ font-size:13.5px; color:#ffd9a1; letter-spacing:1px; margin-bottom:14px; }
  #sens{ width:100%; margin:0 0 6px; accent-color:#ffb066; }
  .panel-row{ display:flex; gap:10px; justify-content:center; margin-top:12px; }
  .panel-note{ margin-top:14px; font-size:11.5px; line-height:1.7; color:rgba(255,255,255,.55); }
  .btn{
    -webkit-appearance:none; appearance:none; border:0; cursor:pointer;
    padding:12px 30px; border-radius:999px;
    font-size:16px; font-weight:600; color:#41142c; letter-spacing:1px;
    background:linear-gradient(180deg,#ffe6ab,#ffbb6b);
    box-shadow:0 10px 26px rgba(255,170,90,.32);
    font-family:inherit;
  }
  .btn:active{ transform:translateY(1px) scale(.99); }
  .btn.small{ padding:9px 18px; font-size:13px; box-shadow:none; }
  .btn.ghost{
    background:rgba(255,255,255,.08); color:#fff;
    border:1px solid rgba(255,255,255,.16);
  }

  /* ---------------- 开始遮罩 ---------------- */
  .overlay{
    position:absolute; z-index:30; left:0; top:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    padding:26px;
    background:radial-gradient(120% 80% at 50% 30%, rgba(40,18,66,.86), rgba(10,4,16,.94));
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    transition:opacity .5s ease;
  }
  .overlay.fade{ opacity:0; pointer-events:none; }
  .ov-card{ width:100%; max-width:340px; text-align:center; }
  .ov-emoji{ font-size:46px; line-height:1; margin-bottom:16px; }
  .ov-card h1{
    margin:0 0 12px; font-size:22px; font-weight:700; letter-spacing:1px;
  }
  .ov-card p{
    margin:0 0 26px; font-size:14px; line-height:1.85; color:rgba(255,255,255,.72);
  }
  .ov-tip{ margin:20px 0 0 !important; font-size:11.5px; color:rgba(255,255,255,.42) !important; line-height:1.7 !important; }
</style>
</head>
<body>
<div id="stage">
  <div class="sky"></div>
  <div class="moon" id="moon"></div>
  <canvas id="fx"></canvas>

  <div class="scene">
    <div class="glow" id="glow"></div>
    <div class="cake">
      <div class="plate"></div>
      <div class="shadow"></div>
      <div class="layer bot"><span class="drip"></span></div>
      <div class="layer mid"><span class="drip"></span></div>
      <div class="layer top"><span class="drip"></span></div>
      <div class="candles" id="candles"></div>
    </div>
  </div>

  <div class="hint hidden" id="hint">
    <div class="hint-main" id="hintMain"></div>
    <div class="hint-sub" id="hintSub"></div>
  </div>

  <div class="meter-wrap hidden" id="meterWrap">
    <div class="meter"><i id="meterBar"></i></div>
    <div class="mic-state" id="micState"></div>
  </div>

  <div class="card" id="card">
    <div class="card-to" id="cardTo"></div>
    <div id="cardLines"></div>
    <div class="card-from" id="cardFrom"></div>
  </div>

  <div class="tools hidden" id="tools">
    <button class="icon-btn" id="gearBtn" aria-label="设置">⚙</button>
    <button class="icon-btn hidden" id="soundBtn" aria-label="声音">🔊</button>
    <button class="icon-btn hidden" id="againBtn" aria-label="再来一次">↻</button>
  </div>

  <div class="panel hidden" id="panel">
    <div class="panel-title">吹气灵敏度</div>
    <input id="sens" type="range" min="0.6" max="1.8" step="0.1" value="1" />
    <div class="panel-row">
      <button class="btn small" id="retryMic">开启/重试麦克风</button>
      <button class="btn small ghost" id="closePanel">关闭</button>
    </div>
    <div class="panel-note" id="panelNote">麦克风状态：未开始</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="ov-card">
      <div class="ov-emoji">🎂</div>
      <h1>今天是你的生日</h1>
      <p>蛋糕已经点好啦<br />先闭上眼睛许个愿<br />再对着手机吹口气，把蜡烛吹灭</p>
      <button class="btn" id="startBtn">开 始</button>
      <p class="ov-tip">点「开始」后手机会问是否允许使用麦克风，请点「允许」<br />吹不灭也没关系，直接点蜡烛也能灭</p>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     ★★★ 想改内容，只改这里 ★★★
     ============================================================ */
  var CONFIG = {
    // 页面上的称呼，显示在祝福卡片第一行
    to: "美丽大方的杨美女",

    // 祝福语，每一句一行（第一句会被放大显示）
    greeting: [
      "生日快乐！🎂",
      "恭喜杨美女也是迈入属于你的二十岁啦！",
      "小小的蛋糕送给你，祝你新岁无忧，万事如愿，永远被幸福围绕！🎆🎇✨"
    ],

    // 落款
    from: "DF",

    // 蜡烛数量，建议 5~8 根
    candleCount: 6,

    // 蜡烛全灭后是否播放生日歌（用代码合成的，不需要联网）
    music: true,

    // 蛋糕配色：只填 #RRGGBB 色号即可，深浅色会自动算出来，
    // 所以换一个颜色，蛋糕依然有立体感。（填错格式就用默认色，不会白屏）
    colors: {
      cakeTop: "#bfe3ff",       // 最上面一层（浅蓝）
      cakeMid: "#8ec5f0",       // 中间一层（天蓝）
      cakeBot: "#6aa8dd",       // 最下面一层（海蓝）
      cream: "#ffffff",         // 奶油 / 糖霜
      candleStripe: "#7fb6e8",  // 蜡烛的条纹色
      candleBase: "#ffffff",    // 蜡烛的底色
      flame: "#ffb84d"          // 火焰主色（暖金色，和蓝蛋糕对比更明显）
    }
  };
  /* ============================================================ */

  /* ---------- 小工具 ---------- */
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoothstep(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  /* ---------- 配色：把 CONFIG.colors 变成 CSS 变量 ---------- */
  function isHex(c) {
    return typeof c === "string" && /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c.trim());
  }
  function toRgb(hex) {
    var h = hex.trim().replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(hex, w, target) {            // w=0 保持原色，target 传白色变亮 / 黑色变深
    var c = toRgb(hex);
    return "rgb(" + c.map(function (v, i) {
      return Math.round(v * (1 - w) + target[i] * w);
    }).join(",") + ")";
  }
  function rgba(hex, a) {
    return "rgba(" + toRgb(hex).join(",") + "," + a + ")";
  }
  function applyColors() {
    var C = CONFIG.colors || {};
    var st = document.documentElement.style;
    var WHITE = [255, 255, 255], BLACK = [0, 0, 0];

    [["bot", C.cakeBot], ["mid", C.cakeMid], ["top", C.cakeTop]].forEach(function (p) {
      if (!isHex(p[1])) return;            // 色号写错就保持默认配色

      st.setProperty("--" + p[0] + "-2", mix(p[1], 0, WHITE));

    });

      st.setProperty("--cream-1", mix(C.cream, 0.5, WHITE));
      st.setProperty("--cream-2", mix(C.cream, 0, WHITE));
      st.setProperty("--cream-a0", rgba(C.cream, 0));
    }
    if (isHex(C.candleBase)) st.setProperty("--candle-a", mix(C.candleBase, 0, WHITE));
    if (isHex(C.candleStripe)) st.setProperty("--candle-b", mix(C.candleStripe, 0, WHITE));
    if (isHex(C.flame)) {
      st.setProperty("--flame-in", mix(C.flame, 0.86, WHITE));
      st.setProperty("--flame-mid", mix(C.flame, 0.48, WHITE));
      st.setProperty("--flame-core", mix(C.flame, 0, WHITE));
      st.setProperty("--flame-glow", rgba(C.flame, 0.42));
      st.setProperty("--flame-glow2", rgba(C.flame, 0.16));

  }

  var els = {
    stage: $("stage"),
    canvas: $("fx"),
    glow: $("glow"),
    moon: $("moon"),
    candles: $("candles"),
    hint: $("hint"),
    hintMain: $("hintMain"),
    hintSub: $("hintSub"),
    meterWrap: $("meterWrap"),
    meterBar: $("meterBar"),
    micState: $("micState"),
    card: $("card"),
    cardTo: $("cardTo"),
    cardLines: $("cardLines"),
    cardFrom: $("cardFrom"),
    tools: $("tools"),
    gearBtn: $("gearBtn"),
    soundBtn: $("soundBtn"),
    againBtn: $("againBtn"),
    panel: $("panel"),
    panelNote: $("panelNote"),
    sens: $("sens"),
    retryMic: $("retryMic"),
    closePanel: $("closePanel"),
    overlay: $("overlay"),
    startBtn: $("startBtn")
  };

  var candles = [];          // { el, wrap, flame, lit, lean }
  var litCount = 0;

  var state = {
    started: false,
    allOut: false,
    heat: 0,                 // 吹气累积的热量，到 1 就灭一根
    score: 0,                // 瞬时吹气强度 0~1
    scoreSmooth: 0,
    noiseFloor: 0.004,
    sensitivity: 1,
    micReady: false,
    floatSpec: false,
    micError: "",
    hintTimer: null
  };

  /* ============================================================
     1. 生成蜡烛
     ============================================================ */
  function buildCandles() {
    var n = clamp(Math.round(CONFIG.candleCount) || 6, 1, 10);
    els.candles.innerHTML = "";
    candles = [];
    for (var i = 0; i < n; i++) {
      var el = document.createElement("div");
      el.className = "candle";
      el.style.left = ((i + 1) / (n + 1) * 100).toFixed(3) + "%";
      el.style.height = (36 + (i % 2) * 5) + "px";

      var wrap = document.createElement("div");
      wrap.className = "wrap";
      var flame = document.createElement("div");
      flame.className = "flame";
      wrap.appendChild(flame);
      el.appendChild(wrap);

      var c = {
        el: el,
        wrap: wrap,
        flame: flame,
        lit: true,
        lean: -6 + Math.random() * 12
      };
      // pointerdown 为主，touchstart 兼容老内核；两者都触发时第二次会被 lit 判断拦掉
      el.addEventListener("pointerdown", onCandleTap(c));
      el.addEventListener("touchstart", onCandleTap(c), { passive: false });
      els.candles.appendChild(el);
      candles.push(c);
    }
    litCount = candles.length;
    updateGlow();
  }

  /* 备用方式：手指点蜡烛 */
  function onCandleTap(c) {
    return function (e) {
      e.preventDefault();
      if (!state.started || state.allOut) return;
      if (c.lit) extinguish(c);
    };
  }

  function updateGlow() {
    var ratio = candles.length ? litCount / candles.length : 0;
    els.glow.style.opacity = (0.22 + 0.78 * ratio).toFixed(3);
  }

  /* ============================================================
     2. 声音（全部用 Web Audio 合成，无外部文件）
     ============================================================ */
  var actx = null, master = null, musicGain = null, sfxGain = null, noiseBuf = null;
  var muted = false;
  var musicNodes = [];

  function initAudio() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(actx.destination);

    musicGain = actx.createGain();
    musicGain.gain.value = 0.8;
    var lp = actx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 4200;
    musicGain.connect(lp); lp.connect(master);

    sfxGain = actx.createGain();
    sfxGain.gain.value = 1;
    sfxGain.connect(master);

    // 一段白噪声，用于「吹灭」的气声
    var len = Math.floor(actx.sampleRate * 0.5);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    // iOS 需要一次用户手势内的播放来解锁音频
    var src = actx.createBufferSource();
    src.buffer = noiseBuf;
    var g = actx.createGain(); g.gain.value = 0.0001;
    src.connect(g); g.connect(actx.destination);
    src.start(0); src.stop(actx.currentTime + 0.01);
  }

  function puffSound() {
    if (!actx || muted) return;
    var t = actx.currentTime;
    var src = actx.createBufferSource();
    src.buffer = noiseBuf;
    var bp = actx.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(1700, t);
    bp.frequency.exponentialRampToValueAtTime(520, t + 0.3);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    src.connect(bp); bp.connect(g); g.connect(sfxGain);
    src.start(t); src.stop(t + 0.36);
  }

  function chime() {
    if (!actx || muted) return;
    var t = actx.currentTime;
    [1046.5, 1318.5, 1568.0].forEach(function (f, i) {
      var o = actx.createOscillator();
      o.type = "sine"; o.frequency.value = f;
      var g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t + i * 0.09);
      g.gain.linearRampToValueAtTime(0.07, t + i * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.9);
      o.connect(g); g.connect(sfxGain);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 1);
    });
  }

  // 生日快乐歌旋律：[频率, 拍数]
  var MELODY = [
    [392.00, 0.5], [392.00, 0.5], [440.00, 1], [392.00, 1], [523.25, 1], [493.88, 2],
    [392.00, 0.5], [392.00, 0.5], [440.00, 1], [392.00, 1], [587.33, 1], [523.25, 2],
    [392.00, 0.5], [392.00, 0.5], [783.99, 1], [659.25, 1], [523.25, 1], [493.88, 1], [440.00, 2],
    [698.46, 0.5], [698.46, 0.5], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 2.5]
  ];

  function playMelody() {
    if (!actx || muted || !CONFIG.music) return;
    stopMelody();
    if (actx.state === "suspended") actx.resume();
    var beat = 0.44;
    var t = actx.currentTime + 0.25;
    MELODY.forEach(function (note) {
      voice(note[0], t, note[1] * beat * 0.92);
      t += note[1] * beat;
    });
  }

  function voice(freq, t, dur) {
    var o1 = actx.createOscillator();
    o1.type = "triangle"; o1.frequency.value = freq;
    var o2 = actx.createOscillator();
    o2.type = "sine"; o2.frequency.value = freq * 2;
    var g1 = actx.createGain(), g2 = actx.createGain();
    var a = 0.014, rel = 0.24;

    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.linearRampToValueAtTime(0.19, t + a);
    g1.gain.linearRampToValueAtTime(0.12, t + dur * 0.6);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);

    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime(0.04, t + a);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.85 + rel * 0.5);

    o1.connect(g1); g1.connect(musicGain);
    o2.connect(g2); g2.connect(musicGain);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + rel + 0.05); o2.stop(t + dur + rel + 0.05);
    musicNodes.push(o1, o2);
  }

  function stopMelody() {
    musicNodes.forEach(function (n) { try { n.stop(); } catch (e) {} });
    musicNodes = [];
  }

  /* ============================================================
     3. 麦克风 + 吹气识别
     ============================================================ */
  var analyser = null, specData = null, timeData = null;
  var calib = { active: false, samples: [], t0: 0 };
  var TIP_DELAY = 7000;
  var tipShown = false;

  function setMicState(text) {
    els.micState.textContent = text;
    els.panelNote.textContent = "麦克风状态：" + text;
  }

  function initMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error("当前浏览器不支持麦克风"));
    }
    var strict = {
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1
      }
    };
    return navigator.mediaDevices.getUserMedia(strict)
      .catch(function () {
        // 部分浏览器不接受上面的参数，退回默认
        return navigator.mediaDevices.getUserMedia({ audio: true });
      })
      .then(function (stream) {
        var src = actx.createMediaStreamSource(stream);
        var hp = actx.createBiquadFilter();
        hp.type = "highpass"; hp.frequency.value = 250; hp.Q.value = 0.7;
        analyser = actx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.55;
        analyser.minDecibels = -92;
        analyser.maxDecibels = -12;
        src.connect(hp); hp.connect(analyser);

        timeData = new Uint8Array(analyser.fftSize);
        state.floatSpec = typeof analyser.getFloatFrequencyData === "function";
        specData = state.floatSpec
          ? new Float32Array(analyser.frequencyBinCount)
          : new Uint8Array(analyser.frequencyBinCount);

        state.micReady = true;
        setMicState(state.floatSpec ? "麦克风已就绪，对着手机吹吧" : "麦克风已就绪（简化模式）");

        // 先安静 1 秒校准环境噪声
        calib.active = true;
        calib.samples = [];
        calib.t0 = performance.now();
        setHint("先安静一秒…", "我正在听听你周围有多安静");
        return true;
      });
  }

  function analyze(dt) {
    // ---- 读取音量 ----
    var rms = 0;
    if (state.micReady) {
      analyser.getByteTimeDomainData(timeData);
      var sum = 0;
      for (var i = 0; i < timeData.length; i++) {
        var v = (timeData[i] - 128) / 128;
        sum += v * v;
      }
      rms = Math.sqrt(sum / timeData.length);
    }

    if (calib.active) {
      calib.samples.push(rms);
      var done = calib.samples.length > 40 || performance.now() - calib.t0 > 1400;
      if (done) {
        var sorted = calib.samples.slice().sort(function (a, b) { return a - b; });
        var med = sorted[Math.floor(sorted.length / 2)] || 0.003;
        state.noiseFloor = Math.max(0.0012, med * 1.7);
        calib.active = false;
        setHint("许个愿，然后吹蜡烛吧 🌬", "对着手机底部（麦克风那端）吹一口气");
        scheduleTip();
      }
      state.score = 0;
      return;
    }

    // ---- 频谱平坦度：吹气是宽频噪声，说话/音乐比较「有音调」 ----
    var flat = 1;
    if (state.micReady && state.floatSpec) {
      analyser.getFloatFrequencyData(specData);
      var binHz = actx.sampleRate / analyser.fftSize;
      var i0 = Math.max(1, Math.floor(400 / binHz));
      var i1 = Math.min(specData.length - 1, Math.floor(8000 / binHz));
      var sumLin = 0, sumLog = 0, n = 0;
      for (var k = i0; k <= i1; k++) {
        var db = specData[k];
        if (!isFinite(db)) db = -100;
        var m = Math.pow(10, db / 20);
        if (m < 1e-7) m = 1e-7;
        sumLin += m; sumLog += Math.log(m); n++;
      }
      if (n > 10) {
        var arith = sumLin / n;
        var geo = Math.exp(sumLog / n);
        flat = arith > 0 ? geo / arith : 0;
      }
    }

    // ---- 判定 ----
    var sens = state.sensitivity;
    var thr = Math.max(state.noiseFloor * 1.8, state.noiseFloor + 0.008) / sens;
    var levelScore = smoothstep(thr, thr * 2.2, rms);
    var flatScore = smoothstep(0.42, 0.72, flat);
    var gate = state.floatSpec ? (0.18 + 0.82 * flatScore) : 1;

    state.score = levelScore * gate;
    state.scoreSmooth += (state.score - state.scoreSmooth) * Math.min(1, dt * 14);

    // 安静时缓慢更新噪声基准
    if (state.scoreSmooth < 0.2) {
      state.noiseFloor = state.noiseFloor * 0.985 + rms * 0.015;
      state.noiseFloor = clamp(state.noiseFloor, 0.0012, 0.08);
    }

    // ---- 累积热量，到 1 就吹灭一根 ----
    if (!state.allOut && state.started) {
      if (state.scoreSmooth > 0.06) {
        state.heat += state.scoreSmooth * dt * 2.1;
      } else {
        state.heat -= dt * 1.15;
      }
      state.heat = clamp(state.heat, 0, 1.5);
      if (state.heat >= 1) {
        state.heat = 0.1;
        var next = null;
        for (var j = 0; j < candles.length; j++) {
          if (candles[j].lit) { next = candles[j]; break; }
        }
        if (next) extinguish(next);
      }
    }
  }

  /* ============================================================
     4. 灭蜡烛 / 全灭庆祝 / 重来
     ============================================================ */
  function extinguish(c) {
    if (!c.lit) return;
    c.lit = false;
    c.el.classList.add("out");
    litCount--;
    updateGlow();
    puffSound();

    for (var i = 0; i < 3; i++) {
      (function (k) {
        setTimeout(function () {
          var s = document.createElement("i");
          s.className = "smoke";
          s.style.setProperty("--dx", (k === 0 ? -8 : (k === 1 ? 6 : -2)) + "px");
          s.style.width = s.style.height = (9 + k * 3) + "px";
          s.style.marginLeft = -(4.5 + k * 1.5) + "px";
          s.style.animationDelay = (k * 0.11) + "s";
          c.el.appendChild(s);
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 2200);
        }, 60 * k);
      })(i);
    }

    if (litCount <= 0) {
      state.allOut = true;
      setTimeout(celebrate, 320);
    }
  }

  function celebrate() {
    els.hint.classList.add("hidden");
    els.meterWrap.classList.add("hidden");
    els.moon.style.opacity = "0.18";   // 让月亮退到背景，别和祝福卡抢戏
    els.soundBtn.classList.remove("hidden");
    els.againBtn.classList.remove("hidden");
    spawnConfetti(130);
    chime();
    if (CONFIG.music) playMelody();

    var bursts = [[0.28, 0.30], [0.72, 0.24], [0.5, 0.38], [0.2, 0.42], [0.82, 0.40]];
    bursts.forEach(function (b, i) {
      setTimeout(function () {
        burstFx(b[0] * canvasW(), b[1] * canvasH(), [330, 285, 195, 45, 300][i]);
      }, 420 + i * 380);
    });
    setTimeout(function () { spawnConfetti(70); }, 1200);

    // 显示祝福卡片
    els.cardTo.textContent = "To " + CONFIG.to;
    els.cardFrom.textContent = CONFIG.from || "";
    els.cardLines.innerHTML = "";
    CONFIG.greeting.forEach(function (line, i) {
      var p = document.createElement("p");
      if (i === 0) p.className = "big";
      p.textContent = line;
      els.cardLines.appendChild(p);
      setTimeout(function () { p.classList.add("show"); }, 260 + i * 420);
    });
    els.card.classList.add("show");
  }

  function relightAll() {
    state.allOut = false;
    state.heat = 0;
    stopMelody();
    candles.forEach(function (c) {
      c.lit = true;
      c.el.classList.remove("out");
      c.wrap.style.transform = "";
      c.flame.style.opacity = "";
    });
    litCount = candles.length;
    updateGlow();
    els.card.classList.remove("show");
    els.moon.style.opacity = "0.9";
    els.soundBtn.classList.add("hidden");
    els.againBtn.classList.add("hidden");
    els.hint.classList.remove("hidden");
    els.meterWrap.classList.remove("hidden");
    if (state.micReady && !calib.active) {
      setHint("再来一次 🌬", "对着手机底部吹一口气");
    } else {
      setHint("再来一次 🌬", "点一下蜡烛也能吹灭它");
    }
    particles.length = 0;
  }

  /* ============================================================
     5. 画布特效：彩带 / 烟花 / 气流
     ============================================================ */
  var cvs = els.canvas, ctx = cvs.getContext("2d");
  var canvasPxW = 300, canvasPxH = 600;
  var particles = [];
  var flamePoint = { x: 150, y: 400 };

  function canvasW() { return canvasPxW; }
  function canvasH() { return canvasPxH; }

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var r = els.stage.getBoundingClientRect();
    canvasPxW = Math.max(1, Math.round(r.width));
    canvasPxH = Math.max(1, Math.round(r.height));
    cvs.width = Math.round(canvasPxW * dpr);
    cvs.height = Math.round(canvasPxH * dpr);
    cvs.style.width = canvasPxW + "px";
    cvs.style.height = canvasPxH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateFlamePoint();
  }

  function updateFlamePoint() {
    var cr = els.candles.getBoundingClientRect();
    var sr = els.stage.getBoundingClientRect();
    if (cr.width) {
      flamePoint.x = cr.left - sr.left + cr.width / 2;
      flamePoint.y = cr.top - sr.top - 4;
    } else {
      flamePoint.x = canvasPxW / 2;
      flamePoint.y = canvasPxH * 0.62;
    }
  }

  function spawnConfetti(n) {
    var colors = ["#ff9dbb", "#ffd76a", "#8ee0ff", "#c3a1ff", "#ffffff", "#7ef0c0", "#ff8f6b"];
    for (var i = 0; i < n; i++) {
      particles.push({
        k: "conf",
        x: Math.random() * canvasPxW,
        y: -20 - Math.random() * canvasPxH * 0.4,
        vx: (Math.random() - 0.5) * 70,
        vy: 70 + Math.random() * 130,
        w: 5 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 9,
        c: colors[(Math.random() * colors.length) | 0],
        life: 5 + Math.random() * 2.5,
        age: 0
      });
    }
    trimParticles();
  }

  function burstFx(x, y, hue) {
    var n = 46;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 55 + Math.random() * 190;
      particles.push({
        k: "spark",
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 26,
        hue: hue + (Math.random() * 44 - 22),
        size: 1.3 + Math.random() * 1.7,
        life: 1.1 + Math.random() * 0.8,
        age: 0,
        px: x, py: y
      });
    }
    trimParticles();
  }

  function spawnWind() {
    var n = Math.round(state.scoreSmooth * 3.2);
    for (var i = 0; i < n; i++) {
      particles.push({
        k: "wind",
        x: flamePoint.x + (Math.random() - 0.5) * 130,
        y: flamePoint.y + (Math.random() - 0.3) * 70,
        vx: (Math.random() - 0.5) * 46,
        vy: -55 - Math.random() * 80,
        len: 9 + Math.random() * 22,
        life: 0.6 + Math.random() * 0.5,
        age: 0
      });
    }
    trimParticles();
  }

  function trimParticles() {
    if (particles.length > 900) particles.splice(0, particles.length - 900);
  }

  function drawFx(dt) {
    ctx.clearRect(0, 0, canvasPxW, canvasPxH);
    if (state.scoreSmooth > 0.05 && state.started && !state.allOut) spawnWind();

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      var t = p.age / p.life;

      if (p.k === "conf") {
        p.vy += 230 * dt;
        p.vx *= 0.995;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        ctx.save();
        ctx.globalAlpha = (1 - t * t) * 0.95;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      } else if (p.k === "spark") {
        p.px = p.x; p.py = p.y;
        p.vy += 78 * dt;
        p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        ctx.beginPath();
        ctx.strokeStyle = "hsla(" + p.hue.toFixed(0) + ",100%,72%," + (1 - t).toFixed(2) + ")";
        ctx.lineWidth = p.size;
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else if (p.k === "wind") {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,255,255," + (0.16 * (1 - t) * clamp(state.scoreSmooth + 0.3, 0, 1)).toFixed(3) + ")";
        ctx.lineWidth = 1.2;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02 - p.len * 0.25);
        ctx.stroke();
      }
    }
  }

  /* ============================================================
     6. 主循环：火焰动画
     ============================================================ */
  var lastTs = 0;

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000) || 0.016;
    lastTs = ts;

    if (state.started) analyze(dt);

    // 火焰：跟着气流量抖动、变矮
    var heatN = clamp(state.heat, 0, 1);
    for (var i = 0; i < candles.length; i++) {
      var c = candles[i];
      if (!c.lit) continue;
      var wob = Math.sin(ts * 0.012 + i * 1.7) * (2.5 + 17 * state.scoreSmooth);
      var sy = clamp(1 - 0.45 * heatN + 0.05 * Math.sin(ts * 0.02 + i * 2.1), 0.42, 1.12);
      var sx = clamp(1 - 0.16 * heatN, 0.7, 1.1);
      c.wrap.style.transform =
        "rotate(" + (c.lean + wob).toFixed(1) + "deg) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
      c.flame.style.opacity = (1 - 0.22 * heatN).toFixed(2);
    }

    els.meterBar.style.width = (clamp(state.scoreSmooth, 0, 1) * 100).toFixed(1) + "%";
    drawFx(dt);
    requestAnimationFrame(tick);
  }

  /* ============================================================
     7. 提示文字
     ============================================================ */
  function setHint(main, sub) {
    els.hintMain.textContent = main || "";
    els.hintSub.textContent = sub || "";
  }

  function scheduleTip() {
    if (state.hintTimer) clearTimeout(state.hintTimer);
    state.hintTimer = setTimeout(function () {
      if (state.allOut || tipShown) return;
      tipShown = true;
      setHint("吹不动蜡烛？", "试着离麦克风近一点，或者直接点一下蜡烛");
    }, TIP_DELAY);
  }

  /* ============================================================
     8. 交互
     ============================================================ */
  function start() {
    if (state.started) return;
    state.started = true;
    initAudio();                    // 必须在用户手势里初始化音频
    els.overlay.classList.add("fade");
    setTimeout(function () { els.overlay.classList.add("hidden"); }, 520);
    els.tools.classList.remove("hidden");
    els.hint.classList.remove("hidden");
    els.meterWrap.classList.remove("hidden");
    setHint("先许个愿 🤍", "然后对着手机吹口气，把蜡烛吹灭");

    initMic()
      .then(function () {
        els.tools.classList.remove("hidden");
      })
      .catch(function (err) {
        state.micReady = false;
        var msg = (err && err.name === "NotAllowedError")
          ? "麦克风被拒绝了"
          : "这台设备的浏览器拿不到麦克风";
        setMicState(msg);
        setHint("点一下蜡烛也能吹灭它", msg + "，可以直接点蜡烛试试（也可以点右上角 ⚙ 重试）");
      });
  }

  els.startBtn.addEventListener("click", start);

  els.gearBtn.addEventListener("click", function () {
    els.panel.classList.toggle("hidden");
  });
  els.closePanel.addEventListener("click", function () {
    els.panel.classList.add("hidden");
  });
  els.sens.addEventListener("input", function () {
    state.sensitivity = parseFloat(els.sens.value) || 1;
  });
  els.retryMic.addEventListener("click", function () {
    if (!actx) initAudio();
    if (actx && actx.state === "suspended") actx.resume();
    setMicState("正在申请麦克风…");
    tipShown = false;
    initMic().catch(function () {
      setMicState("还是不行，试试用 Safari 打开，或直接点蜡烛");
    });
  });
  els.soundBtn.addEventListener("click", function () {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.9;
    if (muted) stopMelody();
    els.soundBtn.textContent = muted ? "🔇" : "🔊";
  });
  els.againBtn.addEventListener("click", relightAll);

  document.addEventListener("touchstart", function once() {
    if (actx && actx.state === "suspended") actx.resume();
    document.removeEventListener("touchstart", once);
  }, { passive: true });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && actx && actx.state === "suspended" && state.started) actx.resume();
  });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 260); });

  /* ============================================================
     9. 启动
     ============================================================ */
  applyColors();
  buildCandles();
  els.cardTo.textContent = "To " + CONFIG.to;
  els.cardFrom.textContent = CONFIG.from || "";
  resize();
  setMicState("未开始");
  requestAnimationFrame(tick);
  window.addEventListener("load", resize);
})();
</script>
</body>
</html>
